name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate multiplayer configuration
        env:
          PARTYSERVER_HOST: ${{ vars.PARTYSERVER_HOST }}
        run: node scripts/prepare-env.mjs

      - name: Inject PartyKit host into env.js
        run: |
          HOST="${{ secrets.PARTYKIT_HOST }}"
          if [ -z "$HOST" ]; then
            HOST="websim-socket.farl.partykit.dev"
          fi
          cat > env.js <<EOF
          export const PARTYKIT_HOST = '$HOST';
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
